<body class="bg-background text-on-background min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center px-margin-mobile md:px-margin-desktop py-2xl">

<p class="font-body-md text-body-md text-on-surface-variant">We've sent a 6-digit code to your email.</p>
</div>
<!-- Verification Form -->
<form class="space-y-xl" id="verify-form">
<div class="flex justify-between gap-2 md:gap-sm" id="otp-container">
<input aria-label="Digit 1" class="code-input w-full aspect-square text-center font-h3 text-h3 border-[1.5px] border-outline-variant rounded-lg bg-surface-container-low transition-all duration-200 focus:outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 2" class="code-input w-full aspect-square text-center font-h3 text-h3 border-[1.5px] border-outline-variant rounded-lg bg-surface-container-low transition-all duration-200 focus:outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 3" class="code-input w-full aspect-square text-center font-h3 text-h3 border-[1.5px] border-outline-variant rounded-lg bg-surface-container-low transition-all duration-200 focus:outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 4" class="code-input w-full aspect-square text-center font-h3 text-h3 border-[1.5px] border-outline-variant rounded-lg bg-surface-container-low transition-all duration-200 focus:outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 5" class="code-input w-full aspect-square text-center font-h3 text-h3 border-[1.5px] border-outline-variant rounded-lg bg-surface-container-low transition-all duration-200 focus:outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
<input aria-label="Digit 6" class="code-input w-full aspect-square text-center font-h3 text-h3 border-[1.5px] border-outline-variant rounded-lg bg-surface-container-low transition-all duration-200 focus:outline-none" inputmode="numeric" maxlength="1" pattern="\d*" type="text"/>
</div>
<div class="text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant" id="resend-container">
                        Didn't receive the code? 
                        <span class="font-bold text-primary" id="countdown">00:59</span>
<button class="hidden font-bold text-primary hover:underline transition-all" id="resend-btn" type="button">Resend Code</button>
</p>
</div>
<button class="w-full bg-primary text-on-primary font-button text-button py-md rounded-lg shadow-sm hover:brightness-90 active:scale-[0.98] transition-all duration-200" type="submit">
                    Verify Code
                </button>
</form>

                    Back to login

<script>
        // OTP Input Logic
        const inputs = document.querySelectorAll('.code-input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.inputType === 'deleteContentBackward') return;
                if (input.value && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });

            // Allow only numbers
            input.addEventListener('keypress', (e) => {
                if (!/[0-9]/.test(e.key)) {
                    e.preventDefault();
                }
            });
        });

        // Countdown Timer Logic
        let timeLeft = 59;
        const countdownEl = document.getElementById('countdown');
        const resendBtn = document.getElementById('resend-btn');

        const timer = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timer);
                countdownEl.classList.add('hidden');
                resendBtn.classList.remove('hidden');
            } else {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                countdownEl.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);

        resendBtn.addEventListener('click', () => {
            // Reset logic would go here
            alert('A new code has been sent to your email.');
            // For demo: reset timer
            location.reload();
        });

        // Form Submit
        document.getElementById('verify-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length === 6) {
                // Success state simulation
                const btn = e.target.querySelector('button[type="submit"]');
                btn.innerHTML = '<span class="flex items-center justify-center gap-2">Verifying...</span>';
                btn.classList.add('opacity-80', 'cursor-not-allowed');
                setTimeout(() => {
                    alert('Verification Successful! Redirecting to password reset...');
                }, 1000);
            } else {
                alert('Please enter all 6 digits.');
            }
        });
    </script>
