<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexa Store - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "primary-fixed-dim": "#b4c5ff",

                    "surface-container-lowest": "#ffffff",
                    "background": "#faf8ff",
                    "on-secondary": "#ffffff",
                    "surface-container": "#ededf9",
                    "error-container": "#ffdad6",
                    "inverse-primary": "#b4c5ff",
                    "on-error": "#ffffff",
                    "tertiary-container": "#bc4800",
                    "surface-dim": "#d9d9e5",
                    "error": "#ba1a1a",
                    "surface-bright": "#faf8ff",
                    "surface": "#faf8ff",
                    "inverse-surface": "#2e3039",
                    "outline": "#737686",
                    "surface-container-highest": "#e1e2ed",
                    "primary-container": "#2563eb",
                    "on-tertiary-container": "#ffede6",
                    "on-background": "#191b23",
                    "on-tertiary-fixed": "#360f00",
                    "on-surface-variant": "#434655",
                    "surface-container-low": "#f3f3fe",
                    "secondary-fixed-dim": "#bec6e0",
                    "on-surface": "#191b23",
                    "on-primary-container": "#eeefff",

                    "tertiary": "#943700",

            },
            "borderRadius": {

            "spacing": {

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus-within {
            border-color: #004ac6;
            box-shadow: 0 0 0 2px rgba(0, 74, 198, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface shadow-[0_2px_4px_rgba(15,23,42,0.05)]">
<div class="flex items-center justify-between px-margin-mobile h-16 w-full max-w-max-width mx-auto">
<div class="flex items-center">
<button class="p-2 -ml-2 text-primary hover:bg-surface-container-low transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
<h1 class="font-h3 text-h3 font-bold text-primary dark:text-primary-fixed-dim">Nexa Store</h1>
<div class="w-10"></div> <!-- Spacer for centering logo -->
</div>
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile pt-lg pb-xl">
<div class="w-full max-w-md">
<!-- Header Text -->
<div class="mb-xl text-center">
<h2 class="font-h1-mobile text-h1-mobile text-on-background mb-sm">Join Nexa</h2>
<p class="font-body-md text-secondary">Discover premium tech and lifestyle curated for you.</p>
</div>
<!-- Registration Form -->
<form class="space-y-lg" id="registrationForm">
<!-- Name -->
<div class="space-y-xs">
<label class="font-button text-button text-on-surface-variant block ml-1" for="name">Full Name</label>
<div class="relative flex items-center h-12 px-md border-2 border-outline-variant rounded-lg bg-surface transition-all duration-200 form-input-focus">
<span class="material-symbols-outlined text-outline mr-md" data-icon="person">person</span>
<input class="flex-grow bg-transparent border-none p-0 focus:ring-0 text-body-md placeholder:text-outline/50" id="name" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="font-button text-button text-on-surface-variant block ml-1" for="email">Email Address</label>
<div class="relative flex items-center h-12 px-md border-2 border-outline-variant rounded-lg bg-surface transition-all duration-200 form-input-focus">
<span class="material-symbols-outlined text-outline mr-md" data-icon="mail">mail</span>
<input class="flex-grow bg-transparent border-none p-0 focus:ring-0 text-body-md placeholder:text-outline/50" id="email" placeholder="john@example.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="font-button text-button text-on-surface-variant block ml-1" for="password">Password</label>
<div class="relative flex items-center h-12 px-md border-2 border-outline-variant rounded-lg bg-surface transition-all duration-200 form-input-focus">
<span class="material-symbols-outlined text-outline mr-md" data-icon="lock">lock</span>
<input class="flex-grow bg-transparent border-none p-0 focus:ring-0 text-body-md placeholder:text-outline/50" id="password" placeholder="••••••••" required="" type="password"/>
<button class="text-outline hover:text-primary transition-colors" onclick="togglePassword('password')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="password_toggle_icon">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-xs">
<label class="font-button text-button text-on-surface-variant block ml-1" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center h-12 px-md border-2 border-outline-variant rounded-lg bg-surface transition-all duration-200 form-input-focus" id="confirmWrapper">
<span class="material-symbols-outlined text-outline mr-md" data-icon="verified_user">verified_user</span>
<input class="flex-grow bg-transparent border-none p-0 focus:ring-0 text-body-md placeholder:text-outline/50" id="confirmPassword" placeholder="••••••••" required="" type="password"/>
<button class="text-outline hover:text-primary transition-colors" onclick="togglePassword('confirmPassword')" type="button">
<span class="material-symbols-outlined" data-icon="visibility" id="confirmPassword_toggle_icon">visibility</span>
</button>
</div>
<p class="hidden text-error font-caption text-caption ml-1" id="validationMessage">Passwords do not match.</p>
</div>
<!-- Create Account Button -->
<button class="w-full h-14 bg-primary text-on-primary font-button text-button rounded-lg shadow-sm hover:brightness-90 transition-all active:scale-[0.98] mt-md" type="submit">
                    Create Account
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-xl">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="px-md font-caption text-caption text-outline">OR CONTINUE WITH</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- Social Signup -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm h-12 border-2 border-outline-variant rounded-lg font-button text-button text-on-surface hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-secondary" data-icon="google">google</span>
                    Google
                </button>
<button class="flex items-center justify-center gap-sm h-12 border-2 border-outline-variant rounded-lg font-button text-button text-on-surface hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-secondary" data-icon="apple" style="font-variation-settings: 'FILL' 1;">file_download</span>
                    Apple
                </button>
</div>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-sm text-secondary">
                    Already have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Sign In</a>
</p>
</div>
</div>
</main>
<!-- Script for Micro-interactions -->
<script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById(id + '_toggle_icon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                input.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const confirmWrapper = document.getElementById('confirmWrapper');
        const validationMessage = document.getElementById('validationMessage');

        function checkMatch() {
            if (confirmInput.value === '') {
                confirmWrapper.classList.remove('border-error', 'border-primary');
                confirmWrapper.classList.add('border-outline-variant');
                validationMessage.classList.add('hidden');
                return;
            }

            if (passwordInput.value === confirmInput.value) {
                confirmWrapper.classList.remove('border-error', 'border-outline-variant');
                confirmWrapper.classList.add('border-primary');
                validationMessage.classList.add('hidden');
            } else {
                confirmWrapper.classList.remove('border-primary', 'border-outline-variant');
                confirmWrapper.classList.add('border-error');
                validationMessage.classList.remove('hidden');
            }
        }

        confirmInput.addEventListener('input', checkMatch);
        passwordInput.addEventListener('input', checkMatch);

        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            if (passwordInput.value !== confirmInput.value) {
                alert('Passwords must match before creating an account.');
                return;
            }
            // Logic for success
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="flex items-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Creating...</span>';
            
            setTimeout(() => {
                btn.innerHTML = 'Account Created!';
                btn.classList.replace('bg-primary', 'bg-green-600');
            }, 1500);
        });
    </script>
</body></html>
