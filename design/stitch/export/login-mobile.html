<!DOCTYPE html>

<meta charset="utf-8"/>

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #faf8ff;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        input:focus + label, input:not(:placeholder-shown) + label {
            transform: translateY(-20px) scale(0.85);
            color: #004ac6;
        }
        .input-transition {
            transition: all 0.2s ease-in-out;
        }
        .error-shake {
            animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Top Navigation Bar (Branding Anchor) -->
<header class="w-full sticky top-0 z-50 bg-surface dark:bg-surface shadow-[0_2px_4px_rgba(15,23,42,0.05)] flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center">
<button aria-label="Back" class="p-2 -ml-2 text-primary">
<span class="material-symbols-outlined">arrow_back</span>
</button>
</div>
<div class="font-h3 text-h3 font-bold text-primary dark:text-primary-fixed-dim">Nexa Store</div>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="flex-1 flex flex-col px-margin-mobile pt-8 pb-12 max-w-md mx-auto w-full">
<!-- Hero Section -->
<section class="mb-10">
<h1 class="font-h1-mobile text-h1-mobile text-on-background mb-2">Welcome Back</h1>
<p class="font-body-md text-body-md text-secondary">Sign in to your account to continue shopping.</p>
</section>
<!-- Login Form -->
<form class="space-y-6 flex-1" id="loginForm" novalidate="">
<!-- Email Input Group -->
<div class="relative group">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-lowest border-outline-variant border-[1.5px] rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" id="email" placeholder=" " required="" type="email"/>
<label class="absolute left-12 top-4 text-outline pointer-events-none input-transition origin-left" for="email">Email Address</label>
</div>
<p class="hidden font-caption text-caption text-error mt-1 ml-4" id="emailError">Please enter a valid email address.</p>
</div>
<!-- Password Input Group -->
<div class="relative group">
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-lowest border-outline-variant border-[1.5px] rounded-lg focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all font-body-md" id="password" placeholder=" " required="" type="password"/>
<label class="absolute left-12 top-4 text-outline pointer-events-none input-transition origin-left" for="password">Password</label>
<button class="absolute right-4 text-outline hover:text-secondary p-1" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="passwordIcon">visibility</span>
</button>
</div>
<div class="flex justify-between items-start mt-1 px-4">
<p class="hidden font-caption text-caption text-error" id="passwordError">Password is required.</p>
<a class="font-caption text-caption text-primary hover:underline ml-auto" href="#">Forgot Password?</a>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-lg font-button text-button shadow-md hover:bg-on-primary-fixed-variant transition-colors flex items-center justify-center gap-2 active:scale-[0.98]" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Social Login & Registration -->
<footer class="mt-12 space-y-8">
<div class="relative flex items-center justify-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="px-4 font-caption text-caption text-secondary bg-background">Or continue with</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<div class="grid grid-cols-3 gap-4">
<button aria-label="Login with Google" class="flex items-center justify-center h-14 bg-surface-container-low border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95">
<div style="width: 24px; height: 24px;">
<svg viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
</div>
</button>
<button aria-label="Login with Apple" class="flex items-center justify-center h-14 bg-surface-container-low border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">file_download</span>
</button>
<button aria-label="Login with Facebook" class="flex items-center justify-center h-14 bg-surface-container-low border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95">
<div style="width: 24px; height: 24px;">
<svg fill="#1877F2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"></path></svg>
</div>
</button>
</div>
<div class="text-center pt-4">
<p class="font-body-sm text-body-sm text-secondary">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Create an Account</a>
</p>
</div>
</footer>
</main>
<!-- Success Modal (Hidden by default) -->
<div class="fixed inset-0 z-[100] flex items-center justify-center bg-on-background/20 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" id="successModal">
<div class="bg-surface-container-lowest p-8 rounded-xl shadow-xl max-w-[280px] w-full text-center scale-90 transition-transform duration-300" id="modalContent">
<div class="w-16 h-16 bg-primary/10 text-primary rounded-full flex items-center justify-center mx-auto mb-4">
<span class="material-symbols-outlined text-[40px]">check_circle</span>
</div>
<h2 class="font-h3 text-h3 mb-2">Welcome!</h2>
<p class="font-body-sm text-body-sm text-secondary">Logging you in...</p>
</div>
</div>
<script>
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const togglePassword = document.getElementById('togglePassword');
        const passwordIcon = document.getElementById('passwordIcon');
        const successModal = document.getElementById('successModal');
        const modalContent = document.getElementById('modalContent');

        // Password visibility toggle
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordIcon.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Simple validation
        const validateEmail = (email) => {
            return String(email)
                .toLowerCase()
                .match(/^(([^<>()[\]\\.,;:\s@"]+(\.[^<>()[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/);
        };

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            let isValid = true;

            // Reset states
            emailError.classList.add('hidden');
            passwordError.classList.add('hidden');
            emailInput.classList.remove('border-error');
            passwordInput.classList.remove('border-error');

            if (!validateEmail(emailInput.value)) {
                emailError.classList.remove('hidden');
                emailInput.classList.add('border-error');
                emailInput.closest('.group').classList.add('error-shake');
                setTimeout(() => emailInput.closest('.group').classList.remove('error-shake'), 400);
                isValid = false;
            }

            if (passwordInput.value.length < 1) {
                passwordError.classList.remove('hidden');
                passwordInput.classList.add('border-error');
                passwordInput.closest('.group').classList.add('error-shake');
                setTimeout(() => passwordInput.closest('.group').classList.remove('error-shake'), 400);
                isValid = false;
            }

            if (isValid) {
                // Show success modal
                successModal.classList.remove('hidden');
                setTimeout(() => {
                    successModal.classList.add('opacity-100');
                    modalContent.classList.remove('scale-90');
                }, 10);

                // Simulate redirect
                setTimeout(() => {
                    console.log("Logged in successfully");
                }, 1500);
            }
        });

        // Real-time error clearing
        emailInput.addEventListener('input', () => {
            if (validateEmail(emailInput.value)) {
                emailError.classList.add('hidden');
                emailInput.classList.remove('border-error');
            }
        });

        passwordInput.addEventListener('input', () => {
            if (passwordInput.value.length > 0) {
                passwordError.classList.add('hidden');
                passwordInput.classList.remove('border-error');
            }
        });
    </script>
</body></html>
